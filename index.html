<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perlette ou Perlereau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary-pink: #ff8fa3;
      --primary-blue: #70d6ff;
      --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #f0f7ff 100%);
      --text-dark: #2b2d42;
      --card-bg: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.5rem;
      background: linear-gradient(45deg, #ff758f, #4ea8de);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px 25px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .card h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.6rem;
      color: #4a4e69;
      margin-bottom: 15px;
    }

    /* CHRONO */
    .timer-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 25px 0;
    }

    .timer-box {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 16px;
      min-width: 75px;
      border: 1px solid #e9ecef;
    }

    .timer-number {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #3d5a80;
    }

    .timer-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #98c1d9;
      font-weight: 700;
    }

    .btn-bypass {
      background: none;
      border: none;
      color: #8d99ae;
      font-size: 0.85rem;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 15px;
    }

    /* CARTE À GRATTER */
    .scratch-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .scratch-reveal-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #fff0f5 0%, #ffdeeb 100%);
      border-radius: 50%;
      padding: 20px;
      text-align: center;
    }

    .gender-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.7rem;
      margin-top: 10px;
      color: #ff4d6d;
    }

    #scratchCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }

    .input-field {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #edf2f4;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 1rem;
      outline: none;
      text-align: center;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(45deg, #ff758f, #4ea8de);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* MODAL CODE */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 20px;
      max-width: 320px;
      width: 90%;
      text-align: center;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Perlette ou Perlereau</h1>
  </header>

  <!-- ÉTAPE 1 : COMPTE À REBOURS -->
  <div class="card" id="stepTimer">
    <h2>Le Grand Décompte</h2>
    <p style="font-size:0.9rem; color:#6c757d;">Révélation prévue à 19h00</p>
    <div class="timer-container">
      <div class="timer-box">
        <div class="timer-number" id="t-hours">00</div>
        <div class="timer-label">Heures</div>
      </div>
      <div class="timer-box">
        <div class="timer-number" id="t-minutes">00</div>
        <div class="timer-label">Minutes</div>
      </div>
      <div class="timer-box">
        <div class="timer-number" id="t-seconds">00</div>
        <div class="timer-label">Secondes</div>
      </div>
    </div>
    <button class="btn-bypass" onclick="openPassModal()">Passer le chrono</button>
  </div>

  <!-- ÉTAPE 2 : CARTE À GRATTER -->
  <div class="card hidden" id="stepScratch">
    <h2>Grattez pour découvrir !</h2>
    <div class="scratch-wrapper">
      <div class="scratch-reveal-content">
        <div style="font-size: 3.5rem;">👧</div>
        <div class="gender-title">C'est une Perlette ! 💖✨</div>
      </div>
      <canvas id="scratchCanvas" width="260" height="260"></canvas>
    </div>
  </div>

  <!-- MODAL PASS -->
  <div class="modal-overlay" id="passModal">
    <div class="modal-content">
      <h3 style="margin-bottom:12px;">Code secret</h3>
      <input type="password" id="passInput" class="input-field" placeholder="Mot de passe">
      <button class="submit-btn" onclick="validatePassword()">Valider</button>
      <button class="btn-bypass" onclick="closePassModal()" style="margin-top:8px;">Annuler</button>
    </div>
  </div>

  <script>
    const SECRET_PASS = "pagnol";
    let isRevealed = false;

    // Fixer l'objectif à 19h aujourd'hui
    const targetDate = new Date();
    targetDate.setHours(19, 0, 0, 0);

      document.getElementById('stepTimer').classList.add('hidden');
      document.getElementById('stepScratch').classList.remove('hidden');
      initScratchCard();
    }
